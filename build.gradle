plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fnfmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// A second client with its own (empty) fnfpacks folder, to test a server sending songs to a player who doesn't have them.
		// ./gradlew runClientNoPacks
		clientNoPacks {
			client()
			name "Minecraft Client (no packs)"
			runDir "run-client2"
		}
	}
}

dependencies {
	// Versions are in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JSON parsing for the charts. Minecraft doesn't come with it, so it's packed inside the mod's jar (include).
	implementation 'org.json:json:20231013'
	include 'org.json:json:20231013'

	// Unit tests (./gradlew test)
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// also build a jar with the source code
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
